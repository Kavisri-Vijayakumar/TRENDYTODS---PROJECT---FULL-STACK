<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Fashion Assistant - TrendyTots</title>

<style>

body{
    font-family:Arial, sans-serif;
    background:#f4f6f9;
    margin:0;
}

.header{
    background:#1E293B;
    color:white;
    padding:20px;
    text-align:center;
}

.container{
    max-width:800px;
    margin:40px auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);
}

textarea{
    width:100%;
    height:120px;
    padding:15px;
}

button{
    margin-top:15px;
    padding:12px 25px;
    background:#D4AF37;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

#result{
    margin-top:25px;
    padding:20px;
    background:#f8fafc;
    border-radius:10px;
}

</style>
</head>

<body>

<div class="header">
    <h1>🤖 TrendyTots AI Fashion Assistant</h1>
</div>

<div class="container">

    <h2>Ask for Outfit Suggestions</h2>

    <textarea
    id="query"
    placeholder="Example: My child is 5 years old and needs a birthday outfit">
    </textarea>

    <button onclick="getSuggestion()">
        Get Suggestion
    </button>

    <div id="result">

        Your recommendation will appear here.

    </div>

</div>

<script>

function getSuggestion(){

let text =
document.getElementById("query")
.value.toLowerCase();

let result =
document.getElementById("result");

if(text.includes("birthday")){

result.innerHTML =
"🎉 We recommend the Pink Party Dress for special birthday celebrations.";

}

else if(text.includes("casual")){

result.innerHTML =
"👕 We recommend the Blue Casual Shirt for everyday comfort and style.";

}

else if(text.includes("baby")){

result.innerHTML =
"🍼 We recommend the Baby Romper for maximum comfort.";

}

else{

result.innerHTML =
"✨ Explore our latest collection for stylish and comfortable outfits.";

}

}

</script>

</body>
</html>
