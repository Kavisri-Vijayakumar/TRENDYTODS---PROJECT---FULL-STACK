    <section class="tryon-section">

        <h1>Virtual Dress Preview</h1>

        <p>Upload a child's image and select an outfit.</p>

        <input type="file" id="imageUpload" accept="image/*">

        <br><br>

        <select id="dressSelect">
            <option value="">Select Dress</option>
            <option value="images/pink-dress.jpg">Pink Party Dress</option>
            <option value="images/blue-shirt.jpg">Blue Casual Shirt</option>
            <option value="images/baby-romper.jpg">Baby Romper</option>
        </select>

        <div class="preview-container">

            <div>
                <h3>Child Photo</h3>
                <img id="previewImage" src="" alt="Child Photo">
            </div>

            <div>
                <h3>Selected Outfit</h3>
                <img id="dressPreview">
            </div>

        </div>

    </section>

    <footer>
        <p>© 2026 TrendyTots | Kids Fashion Store</p>
    </footer>

    <script>
       const imageUpload = document.getElementById("imageUpload");
const previewImage = document.getElementById("previewImage");

imageUpload.addEventListener("change", function () {

    const file = this.files[0];

    if (file) {

        const reader = new FileReader();

        reader.onload = function (e) {

            previewImage.src = e.target.result;
            previewImage.style.display = "block";

        };

        reader.readAsDataURL(file);
    }
});

const dressSelect = document.getElementById("dressSelect");
const dressPreview = document.getElementById("dressPreview");

dressSelect.addEventListener("change", function () {

    dressPreview.src = this.value;
    dressPreview.style.display = "block";

}); 

    </script>

</body>
